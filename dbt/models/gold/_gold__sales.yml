version: 2

models:
  - name: fact_sales
    columns:
      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: customer_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

unit_tests:
  - name: test_customer_lookup_picks_the_scd2_version_valid_on_the_sale_date
    model: fact_sales
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_sales_invoice')
        format: sql
        rows: |
          select 'SINV-1' as sales_invoice_id, 0 as line_idx, 'CUST-1' as customer_id,
                 to_date('2024-03-01') as posting_date, to_date('2024-04-01') as due_date,
                 0 as is_return, 0.0 as outstanding_amount, 100.0 as grand_total,
                 'ITEM-1' as item_id, 1.0 as qty, 100.0 as net_amount, 10.0 as incoming_rate,
                 cast('2024-03-01T00:00:00Z' as timestamp) as _ingested_at
          union all
          select 'SINV-BEFORE' as sales_invoice_id, 0 as line_idx, 'CUST-1' as customer_id,
                 to_date('2024-01-15') as posting_date, to_date('2024-02-15') as due_date,
                 0 as is_return, 0.0 as outstanding_amount, 100.0 as grand_total,
                 'ITEM-1' as item_id, 1.0 as qty, 100.0 as net_amount, 10.0 as incoming_rate,
                 cast('2024-01-15T00:00:00Z' as timestamp) as _ingested_at
          union all
          select 'SINV-BOUNDARY' as sales_invoice_id, 0 as line_idx, 'CUST-1' as customer_id,
                 to_date('2024-02-01') as posting_date, to_date('2024-03-01') as due_date,
                 0 as is_return, 0.0 as outstanding_amount, 100.0 as grand_total,
                 'ITEM-1' as item_id, 1.0 as qty, 100.0 as net_amount, 10.0 as incoming_rate,
                 cast('2024-02-01T00:00:00Z' as timestamp) as _ingested_at
      - input: ref('dim_date')
        format: sql
        rows: |
          select to_date('2024-01-15') as `date`, 20240115 as date_key, 1.3 as usd_per_gbp
          union all
          select to_date('2024-02-01') as `date`, 20240201 as date_key, 1.3 as usd_per_gbp
          union all
          select to_date('2024-03-01') as `date`, 20240301 as date_key, 1.3 as usd_per_gbp
      - input: ref('dim_customer')
        format: sql
        rows: |
          select 111 as customer_key, 'CUST-1' as customer_id, to_date('2023-01-01') as valid_from,
                 to_date('2024-02-01') as valid_to
          union all
          select 555 as customer_key, 'CUST-1' as customer_id, to_date('2024-02-01') as valid_from,
                 cast(null as date) as valid_to
      - input: ref('dim_product')
        format: sql
        rows: |
          select 999 as product_key, 'ITEM-1' as product_id
    expect:
      rows:
        - {customer_key: 555, product_key: 999, quantity: 1.0, net_amount_gbp: 100.0, net_amount_usd: 130.0, cost_amount_gbp: 10.0, cost_amount_usd: 13.0, is_return: false}
        - {customer_key: 111, product_key: 999, quantity: 1.0, net_amount_gbp: 100.0, net_amount_usd: 130.0, cost_amount_gbp: 10.0, cost_amount_usd: 13.0, is_return: false}
        - {customer_key: 555, product_key: 999, quantity: 1.0, net_amount_gbp: 100.0, net_amount_usd: 130.0, cost_amount_gbp: 10.0, cost_amount_usd: 13.0, is_return: false}

  - name: test_left_join_keeps_the_row_when_a_dimension_lookup_has_no_match
    model: fact_sales
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_sales_invoice')
        format: sql
        rows: |
          select 'SINV-ORPHAN' as sales_invoice_id, 0 as line_idx, 'CUST-UNKNOWN' as customer_id,
                 to_date('2024-03-01') as posting_date, to_date('2024-04-01') as due_date,
                 0 as is_return, 0.0 as outstanding_amount, 100.0 as grand_total,
                 'ITEM-UNKNOWN' as item_id, 1.0 as qty, 100.0 as net_amount, 10.0 as incoming_rate,
                 cast('2024-03-01T00:00:00Z' as timestamp) as _ingested_at
      - input: ref('dim_date')
        format: sql
        rows: |
          select to_date('2024-03-01') as `date`, 20240301 as date_key, 1.3 as usd_per_gbp
      - input: ref('dim_customer')
        format: sql
        rows: |
          select 555 as customer_key, 'CUST-1' as customer_id, to_date('2024-02-01') as valid_from,
                 cast(null as date) as valid_to
      - input: ref('dim_product')
        format: sql
        rows: |
          select 999 as product_key, 'ITEM-1' as product_id
    expect:
      rows:
        - {date_key: 20240301, customer_key: null, product_key: null, invoice_id: "SINV-ORPHAN"}
