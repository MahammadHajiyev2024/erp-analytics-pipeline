version: 2

models:
  - name: fact_purchases
    columns:
      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: supplier_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_key
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

unit_tests:
  - name: test_converts_to_usd_using_dim_date_rate_and_joins_supplier_and_product
    model: fact_purchases
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_purchase_invoice')
        format: sql
        rows: |
          select 'PINV-1' as purchase_invoice_id, 0 as line_idx, 'SUP-1' as supplier_id,
                 to_date('2024-03-01') as posting_date, 'ITEM-1' as item_id, 2.0 as qty,
                 40.0 as net_amount, cast('2024-03-01T00:00:00Z' as timestamp) as _ingested_at
      - input: ref('dim_date')
        format: sql
        rows: |
          select to_date('2024-03-01') as `date`, 20240301 as date_key, 1.3 as usd_per_gbp
      - input: ref('dim_supplier')
        format: sql
        rows: |
          select 777 as supplier_key, 'SUP-1' as supplier_id
      - input: ref('dim_product')
        format: sql
        rows: |
          select 999 as product_key, 'ITEM-1' as product_id
    expect:
      rows:
        - {supplier_key: 777, product_key: 999, quantity: 2.0, amount_gbp: 40.0, amount_usd: 52.0}

  - name: test_left_join_keeps_the_row_when_a_dimension_lookup_has_no_match
    model: fact_purchases
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_purchase_invoice')
        format: sql
        rows: |
          select 'PINV-ORPHAN' as purchase_invoice_id, 0 as line_idx, 'SUP-UNKNOWN' as supplier_id,
                 to_date('2024-03-01') as posting_date, 'ITEM-UNKNOWN' as item_id, 2.0 as qty,
                 40.0 as net_amount, cast('2024-03-01T00:00:00Z' as timestamp) as _ingested_at
      - input: ref('dim_date')
        format: sql
        rows: |
          select to_date('2024-03-01') as `date`, 20240301 as date_key, 1.3 as usd_per_gbp
      - input: ref('dim_supplier')
        format: sql
        rows: |
          select 777 as supplier_key, 'SUP-1' as supplier_id
      - input: ref('dim_product')
        format: sql
        rows: |
          select 999 as product_key, 'ITEM-1' as product_id
    expect:
      rows:
        - {date_key: 20240301, supplier_key: null, product_key: null, invoice_id: "PINV-ORPHAN"}
