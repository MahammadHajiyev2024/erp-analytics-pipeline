version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null
      - name: date
        tests:
          - not_null
      - name: month_name
        tests:
          - not_null

unit_tests:
  - name: test_calendar_covers_multi_source_bounds_and_carries_fx_rate_through_gaps
    model: dim_date
    given:
      - input: ref('stg_sales_invoice')
        format: sql
        rows: |
          select 'SINV-1' as sales_invoice_id, 0 as line_idx, 'CUST-1' as customer_id,
                 to_date('2024-01-01') as posting_date, to_date('2024-01-07') as due_date,
                 0 as is_return, 0.0 as outstanding_amount, 100.0 as grand_total,
                 'ITEM-1' as item_id, 1.0 as qty, 100.0 as net_amount, 10.0 as incoming_rate,
                 cast('2024-01-01T00:00:00Z' as timestamp) as _ingested_at
      - input: ref('stg_purchase_invoice')
        format: sql
        rows: |
          select 'PINV-1' as purchase_invoice_id, 0 as line_idx, 'SUP-1' as supplier_id,
                 to_date('2024-01-02') as posting_date, 'ITEM-1' as item_id, 1.0 as qty,
                 50.0 as net_amount, cast('2024-01-02T00:00:00Z' as timestamp) as _ingested_at
      - input: ref('stg_stock_ledger_entry')
        format: sql
        rows: |
          select 'SLE-1' as entry_id, 'ITEM-1' as item_id, to_date('2024-01-03') as posting_date,
                 'Sales Invoice' as voucher_type, -1.0 as actual_qty, 10.0 as qty_after_transaction,
                 cast('2024-01-03T00:00:00Z' as timestamp) as _ingested_at
      - input: ref('stg_exchange_rate')
        format: sql
        rows: |
          select to_date('2024-01-01') as observation_date, 1.25 as usd_per_gbp
          union all
          select to_date('2024-01-05') as observation_date, 1.27 as usd_per_gbp
    expect:
      rows:
        - {date: "2024-01-01", is_weekend: false, usd_per_gbp: 1.25}
        - {date: "2024-01-02", is_weekend: false, usd_per_gbp: 1.25}
        - {date: "2024-01-03", is_weekend: false, usd_per_gbp: 1.25}
        - {date: "2024-01-04", is_weekend: false, usd_per_gbp: 1.25}
        - {date: "2024-01-05", is_weekend: false, usd_per_gbp: 1.27}
        - {date: "2024-01-06", is_weekend: true, usd_per_gbp: 1.27}
        - {date: "2024-01-07", is_weekend: true, usd_per_gbp: 1.27}
