# Product categories for the bootstrap (see docs/bootstrap-rules.md).
#
# Categories are checked in the order below, and the first one with a matching keyword
# wins, so specific or seasonal categories come before broad ones. A keyword matches a
# whole word in the product description, ignoring case, with an optional plural "S" or
# "ES": "MUG" matches "MUG" and "MUGS" but not "SMUG"; "TIN" does not match "TINY".
#
# cost_ratio is the share of an item's typical selling price that MHG pays its supplier.

other_cost_ratio = 0.55

# supplier is the company MHG buys the category's items from.
other_supplier = "Cosy Home Goods Ltd"

[[category]]
name = "Christmas"
supplier = "Yuletide Imports Ltd"
cost_ratio = 0.50
keywords = [
    "CHRISTMAS", "XMAS", "ADVENT", "BAUBLE", "SANTA", "REINDEER", "SNOWFLAKE", "NATIVITY",
    "SNOWMAN", "ANGEL", "STOCKING", "TREE", "CRACKER",
]

